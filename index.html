 if(d>420){a.x=p.x+30;a.y=p.y+30}
 else if(d>85){a.x+=(p.x-a.x)/d*175*dt;a.y+=(p.y-a.y)/d*175*dt}
 a.cool=Math.max(0,a.cool-dt);

 else if(templeDungeon.active)targets=templeCurrent().enemies;

 else if(frontier.region==='elderwood')targets=[wolf,...extraEnemies];

 if(target){
  const td=dist(a,target);
  if(td>56){a.x+=(target.x-a.x)/td*150*dt;a.y+=(target.y-a.y)/td*150*dt}
  if(td<75&&a.cool===0){
   a.cool=1.25;
   if(necro.active)necroStrike(target,22);
   else if(templeDungeon.active)templeHit(target,22);
   else if(v06.encounters.includes(target))v06Hit(target,22,'physical');
   else if(v05.casters.includes(target))v05Hit(target,22);
   else if(frontier.enemies.includes(target)){target.hp-=22;if(target.hp<=0)frontierEnemyDeath(target)}
   else if(target===wolf){target.hp-=22;if(target.hp<=0)killWolf()}
   else if(extraEnemies.includes(target)){target.hp-=22;if(target.hp<=0)killExtra(target)}
   for(let i=0;i<4;i++)particles.push({x:target.x,y:target.y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,t:.25,c:'#b4e4a0'})

 }
}

function respawnRegular(force=false){
 let count=0;
 const revive=(e,save)=>{
  if(e.alive||(!force&&frontier.region==='north'&&Math.hypot(p.x-e.x,p.y-e.y)<500))return;
  e.alive=true;e.hp=e.maxHp||e.hp||75;e.attack=0;e.cool=0;e.loot=false;e.looted=false;
  const pos=respawn.origins.get(e);if(pos){e.x=pos.x;e.y=pos.y}
  count++;
 };
 for(const e of frontier.enemies){
  if(['captain','guardian'].includes(e.id))continue;
  // Keep the watchtower's completed faction state intact; bandits may still return as roaming encounters.
  revive(e);
 }
 for(const e of v05.casters)revive(e);
 for(const e of v06.encounters)revive(e);
 for(const e of extraEnemies)revive(e);
 revive(wolf);
 // Dungeon guardians respawn only on a manual combat reset; never revive the necromancer.
 if(force){
  for(const r of necro.rooms)for(const e of r.enemies){if(e.id==='boss')continue;if(!e.alive){e.alive=true;e.hp=e.maxHp;e.attack=0;count++}}
 }
 if(count){frontierSave();v05Save();v06Save();necroSave();persist()}
 return count;
}

// v0.9.2 — Unified merchant ledger: gold, backpack, buy and sell in one interface.
const trading={vendor:null,tab:'buy'};
const tradeCatalog={
 merchant:[{item:'potion',price:25},{item:'mana',price:30}],
 smith:[{item:'shortsword',price:95},{item:'mace',price:105},{item:'brigandine',price:120},{item:'buckler',price:70}],
 mage:[{spell:'ember',price:65},{spell:'chill',price:85},{spell:'mend',price:90}]
};
const tradePrices={potion:25,mana:30,shortsword:95,mace:105,brigandine:120,buckler:70,
 sword:55,axe:65,staff:55,leather:60,chain:115,shield:45,herb:12,ore:18,pelt:15,ring:70};
function tradeSellValue(id){return Math.max(1,Math.floor((tradePrices[id]||Math.max(5,(itemDefs[id]?.weight||1)*9))*.45))}
function tradeCanSell(id){return !!itemDefs[id]&&itemDefs[id].type!=='quest'&&id!=='fragment'&&progress.equipment[itemDefs[id].type]!==id}
function tradeInventoryCount(){return Object.entries(progress.inventory).filter(([id,n])=>n>0&&itemDefs[id]).length}
function tradeNode(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function tradeButton(text,fn,disabled=false){const b=tradeNode('button',text);b.disabled=disabled;b.onclick=fn;return b}
function tradeOpen(vendor,tab='buy'){
 trading.vendor=vendor;trading.tab=tab;
 openPanel(vendor==='merchant'?'Tovin · Trade Guild':vendor==='smith'?'Garrik · Blacksmith':'Soren · Arcane Archive','',[]);
 tradeRender()
}
function tradeRender(){
 const root=$('panelBody');root.replaceChildren();$('choices').replaceChildren();
 const summary=tradeNode('div',undefined,'tile');
 summary.appendChild(tradeNode('h3','Your purse: '+progress.gold+' gold'));
 summary.appendChild(tradeNode('p','Backpack: '+tradeInventoryCount()+' item types · '+weight().toFixed(1)+' / '+capacity()+' carry weight','muted'));
 root.appendChild(summary);
 const tabs=tradeNode('div',undefined,'itemRow');
 tabs.appendChild(tradeButton((trading.tab==='buy'?'● ':'')+'Buy',()=>{trading.tab='buy';tradeRender()}));
 tabs.appendChild(tradeButton((trading.tab==='sell'?'● ':'')+'Sell',()=>{trading.tab='sell';tradeRender()}));
 root.appendChild(tabs);
 const grid=tradeNode('div',undefined,'gameGrid');
 const stock=tradeNode('div',undefined,'tile');
 stock.appendChild(tradeNode('h3',trading.tab==='buy'?'Merchant stock':'Sell from your backpack'));
 if(trading.tab==='buy'){
  for(const g of tradeCatalog[trading.vendor]){
   const d=g.item?itemDefs[g.item]:spellInfo[g.spell];
   const owned=g.spell&&frontier.spells[g.spell];
   const row=tradeNode('div',undefined,'itemRow');
   const info=tradeNode('div');info.appendChild(tradeNode('b',d.name));
   info.appendChild(tradeNode('p',(d.desc||d.description||'')+' · '+g.price+' gold'+(g.item?' · '+d.weight+' wt':''),'muted'));
   row.appendChild(info);
   const tooHeavy=g.item&&weight()+d.weight>capacity();
   row.appendChild(tradeButton(owned?'Learned':'Buy',()=>{
    if(progress.gold<g.price){msg('Not enough gold.');return}
    if(g.item&&weight()+d.weight>capacity()){msg('Your backpack is too heavy.');return}
    if(g.spell&&frontier.spells[g.spell])return;
    progress.gold-=g.price;
    if(g.spell){frontier.spells[g.spell]=true;if(!spellRotation.includes(g.spell))spellRotation.push(g.spell);saveSpellRotation();updateSpellIndicator();frontierSave();note('Purchased '+d.name+' from Stonehaven Arcane Archive.')}
    else addItem(g.item,1);
    persist();msg('Purchased '+d.name+' for '+g.price+' gold.');tradeRender()
   },!!owned||progress.gold<g.price||!!tooHeavy));
   stock.appendChild(row)
  }
 }else{
  let found=false;
  for(const [id,count] of Object.entries(progress.inventory)){
   if(count<=0||!itemDefs[id])continue;
   found=true;const d=itemDefs[id],can=tradeCanSell(id),value=tradeSellValue(id);
   const row=tradeNode('div',undefined,'itemRow');const info=tradeNode('div');
   info.appendChild(tradeNode('b',d.name+' ×'+count));
   info.appendChild(tradeNode('p',can?'Sell price: '+value+' gold each':'Equipped or quest item · cannot sell','muted'));
   row.appendChild(info);
   row.appendChild(tradeButton('Sell 1',()=>{
    if(!tradeCanSell(id)||(progress.inventory[id]||0)<1)return;
    progress.inventory[id]--;if(!progress.inventory[id])delete progress.inventory[id];
    progress.gold+=value;persist();msg('Sold '+d.name+' for '+value+' gold.');tradeRender()
   },!can));
   if(can&&count>1)row.appendChild(tradeButton('Sell all',()=>{
    const n=progress.inventory[id]||0;if(!n)return;
    delete progress.inventory[id];progress.gold+=value*n;persist();
    msg('Sold '+n+' × '+d.name+' for '+value*n+' gold.');tradeRender()
   }));
   stock.appendChild(row)
  }
  if(!found)stock.appendChild(tradeNode('p','Your backpack is empty.'))
 }
 grid.appendChild(stock);
 const bag=tradeNode('div',undefined,'tile');bag.appendChild(tradeNode('h3','Your inventory'));
 const entries=Object.entries(progress.inventory).filter(([id,n])=>n>0&&itemDefs[id]);
 if(!entries.length)bag.appendChild(tradeNode('p','Nothing in your backpack.','muted'));
 for(const [id,n] of entries){const d=itemDefs[id];const equipped=progress.equipment[d.type]===id;
  bag.appendChild(tradeNode('p',d.name+' ×'+n+(equipped?' · Equipped':'')))}
 if(trading.tab==='sell')grid.appendChild(bag);root.appendChild(grid);
 $('choices').appendChild(tradeButton('Finish trading',closePanel))
}
